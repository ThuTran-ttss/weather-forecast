<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
        <style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  padding: 50px;
}

div {
  background: white;
  width: 320px;
  padding: 15px 20px;
  margin: 10px 0;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

div:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
}

span {
  font-weight: 500;
  color: #333;
}

button {
  border: none;
  padding: 6px 10px;
  margin-left: 5px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
}

/* Down button */
.downButton {
  background: #4CAF50;
  color: white;
}

.downButton:hover {
  background: #43a047;
}

/* Up button */
.upButton {
  background: #ff7043;
  color: white;
}

.upButton:hover {
  background: #f4511e;
}
</style>
    </style>
</head>
<body>
    <div>
        <span> Prepare Presentation </span>
        <button class ="upButton" type="button">↑</button>
        <button class ="downButton" type="button">↓</button>
    </div>
    <div>
        <span> Read Emails</span>
        <button class ="upButton" type="button">↑</button>
        <button class ="downButton" type="button">↓</button>
    </div>
    <div>
        <span> Monthly Reports</span>
        <button class ="upButton" type="button">↑</button>
        <button class ="downButton" type="button">↓</button>
    </div>
    <script>
        function initialize(){
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', event => {
                    const currentDiv = event.target.parentElement;
                    if (event.target.classList.contains('upButton')) {
                        const previousDiv = currentDiv.previousElementSibling;
                        if (previousDiv){currentDiv.parentNode.insertBefore(currentDiv,previousDiv);}
                    }
                    if (event.target.classList.contains('downButton')){
                        const nextDiv = currentDiv.nextElementSibling;
                        if (nextDiv){currentDiv.parentNode.insertBefore(nextDiv,currentDiv);}
                    }
                });
            });
        }
        initialize ();
    </script>
</body>
</html>
